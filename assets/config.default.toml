# Manga Local — настройки.
# Файл копируется в %LOCALAPPDATA%\MangaLocal\config.toml при первом запуске.
# Большинство параметров меняются в панели (F10). Отсутствующие поля берутся по умолчанию.

[general]
# Где читаете: "browser" (браузер), "screen" (весь экран, любая программа)
# или "custom" (своя программа, по части заголовка окна в window_match).
profile = "browser"
# Язык текста: "ko" (корейский, манхва), "ja" (японский, манга), "zh" (китайский, маньхуа), "en".
source_lang = "ko"
# Название тайтла — включает словарь тайтла и подсказывает нейросети (можно оставить пустым).
game_title = ""
# Только для profile = "custom": части заголовка окна через |.
window_match = ""
pause_when_unfocused = true
# Показывать перевод и панель на скриншотах (для отладки). При включении перевод
# теоретически может попасть в собственный OCR, если окажется поверх распознаваемой страницы.
visible_in_screenshots = false

[llm]
# managed — программа сама запускает llama-server.exe;
# external — подключиться к уже запущенному OpenAI-совместимому серверу (другой ПК в сети, LM Studio, Ollama).
mode = "managed"
server_exe = "llama\\llama-server.exe"
port = 8848
external_url = "http://127.0.0.1:8080"
active_model = "hymt2-1.8b"
# Слои на видеокарте: 99 — всё на GPU (Vulkan), 0 — только процессор.
gpu_layers = 99
# Потоки CPU: 0 — автоматически (половина ядер).
threads = 0
ctx_size = 4096
# Пониженный приоритет нейросети, чтобы браузер не тормозил.
low_priority = true
extra_args = []
request_timeout_s = 60

# Модели. hf — ссылка HuggingFace для автоматической загрузки при первом выборе
# (единственный момент, когда нужен интернет). path заполняется сам после загрузки;
# можно указать путь к своему .gguf вручную.
# prompt: "hymt" — для переводческих моделей Tencent Hy-MT, "instruct" — для Gemma и других универсальных моделей.

[[models]]
id = "hymt2-1.8b"
name = "Hy-MT2 1.8B Q4_K_M — быстрый, для слабых ПК (по умолчанию)"
prompt = "hymt"
hf = "tencent/Hy-MT2-1.8B-GGUF:Q4_K_M"
path = ""
temperature = 0.7
top_p = 0.6
top_k = 20
repeat_penalty = 1.05
max_tokens = 256
no_think = false
template = ""
size_gb = 1.13

[[models]]
id = "hymt2-7b"
name = "Hy-MT2 7B Q4_K_M — точный, но медленнее Gemma (видеокарта от 6 ГБ)"
prompt = "hymt"
hf = "tencent/Hy-MT2-7B-GGUF:Q4_K_M"
path = ""
temperature = 0.7
top_p = 0.6
top_k = 20
repeat_penalty = 1.05
max_tokens = 256
no_think = false
template = ""
size_gb = 4.62

[[models]]
id = "gemma4-e4b"
name = "Gemma 4 E4B Q4_K_M — самый живой перевод (видеокарта от 6 ГБ)"
prompt = "instruct"
hf = "unsloth/gemma-4-E4B-it-GGUF:Q4_K_M"
path = ""
temperature = 0.3
top_p = 0.8
top_k = 20
repeat_penalty = 1.05
max_tokens = 256
no_think = true
template = ""
size_gb = 5.0

# Вид и стиль перевода.
[dialogue]
# Сколько прошлых реплик показывать нейросети при переводе по одной.
context_lines = 3
show_original = false
# Шрифт перевода: Balsamiq Sans и Pangolin — комиксные, идут с программой; или любой шрифт Windows.
overlay_font = "Balsamiq Sans"
# Пожелание к стилю (для Gemma и других универсальных моделей), например «проще, как в сёнэне».
style_hint = ""

# Перевод страницы (F8): строки собираются в пузыри, перевод пишется внутри пузыря.
[interface]
# replace — замена в пузыре, backdrop — тёмная подложка, list — списком сбоку
mode = "replace"
upscale = 0
font_scale = 0.82
max_lines = 120
# Следить за прокруткой: пока страница едет, перевод спрятан; остановилась — новые пузыри переводятся сами.
auto_hide = true
# Навести мышь на пузырь — перевод с него уходит, виден оригинал.
hover_original = true
# Нейросеть видит последние реплики прошлой страницы (имена, обращения, тон).
page_context = true
# Японский: столбцы и рукописный текст читает manga-ocr (модель ~440 МБ скачивается при включении).
vertical_ja = false
# Звуки на рисунке («БАХ!», «쾅», «ドキドキ»): translate — переводить коротко отдельно от реплик, keep — не трогать.
sfx = "translate"

[ocr]
# Устарело: язык распознавания берётся из general.source_lang.
language = "zh-Hans-CN"

[hotkeys]
# Примеры: "F8", "Ctrl+F8", "Alt+Shift+T". Назначенная клавиша не передаётся другим программам.
# Пусто — клавиша не назначена.
screen_translate = "F8"
show_original = "F9"
panel = "F10"
# Сохранить экран как случай для проверки (папка cases в данных программы)
save_case = "Ctrl+F9"
# Стоп-кадр: снимок экрана, клик по тексту — перевод
freeze = "Ctrl+F8"
# Перевод плохой: забыть и перевести страницу заново
bad_translation = "Ctrl+F11"
