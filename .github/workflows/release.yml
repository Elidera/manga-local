# Builds manga-local.exe, bundles llama-server (Vulkan + CPU) and produces the
# Windows installer (ready in ~5 minutes). The screenshot tests run afterwards in
# their own job: Windows Update needs ~25 minutes to give the runner Korean and
# Japanese OCR. Push a tag like v0.1.0 to publish a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp release tag (empty = latest)"
        required: false

permissions:
  contents: write
  actions: write # delete old build artifacts

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p manga-core -p manga-pages
      # The OCR engine's own tests need no ONNX Runtime (loaded at run time when used).
      - run: cargo test -p manga-neural-ocr --features dynamic

  windows:
    runs-on: windows-latest
    needs: core-tests
    env:
      LLAMA_TAG: ${{ github.event.inputs.llama_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p manga-core -p manga-pages

      # manga-ocr's build script downloads its model unless the files exist:
      # the program downloads it itself when the reader turns the feature on.
      - name: Placeholder for the manga-ocr model (not needed to build)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ja-dummy" | Out-Null
          foreach ($f in 'encoder_model.onnx','decoder_model.onnx','vocab.txt') { New-Item -ItemType File -Force "$env:RUNNER_TEMP/ja-dummy/$f" | Out-Null }
          "MANGA_OCR_MODELS_DIR=$env:RUNNER_TEMP/ja-dummy" | Out-File -Append $env:GITHUB_ENV

      - name: Clippy
        run: cargo clippy -p manga-local --release --features vertical-ja -- -D clippy::correctness

      - name: Build
        shell: pwsh
        run: |
          # Build date (Moscow time) and commit, shown in the panel and the log.
          $msk = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).ToUniversalTime(), 'Russian Standard Time')
          $env:MANGA_BUILD = "$($msk.ToString('dd.MM.yyyy HH:mm')) · $($env:GITHUB_SHA.Substring(0,7))"
          cargo build -p manga-local --release --features vertical-ja

      - name: Download llama.cpp (Vulkan + CPU)
        shell: pwsh
        run: |
          $tag = $env:LLAMA_TAG
          # Newest regular build (tags like b12017) that already has both Windows zips:
          # a fresh release is published first and gets its files minutes later.
          if ([string]::IsNullOrEmpty($tag)) { $tag = (gh api "repos/ggml-org/llama.cpp/releases?per_page=30" --jq '[.[] | select(.tag_name | test("^b[0-9]+$")) | select(any(.assets[]; .name | test("bin-win-vulkan-x64[.]zip$")) and any(.assets[]; .name | test("bin-win-cpu-x64[.]zip$")))][0].tag_name') }
          Write-Host "llama.cpp $tag"
          New-Item -ItemType Directory -Force dist/llama-vulkan, dist/llama-cpu | Out-Null
          gh release download $tag --repo ggml-org/llama.cpp --pattern "*bin-win-vulkan-x64.zip" --dir dl
          gh release download $tag --repo ggml-org/llama.cpp --pattern "*bin-win-cpu-x64.zip" --dir dl
          Expand-Archive (Get-ChildItem dl/*vulkan-x64.zip).FullName -DestinationPath dist/llama-vulkan
          Expand-Archive (Get-ChildItem dl/*cpu-x64.zip).FullName -DestinationPath dist/llama-cpu
          # Some releases nest binaries in a subfolder: flatten.
          foreach ($d in "dist/llama-vulkan","dist/llama-cpu") {
            $exe = Get-ChildItem $d -Recurse -Filter llama-server.exe | Select-Object -First 1
            if (-not $exe) { throw "llama-server.exe not found in $d" }
            if ($exe.DirectoryName -ne (Resolve-Path $d).Path) { Move-Item "$($exe.DirectoryName)/*" $d -Force }
            # Only llama-server and its DLLs are used: drop the other ~20 tools (~16 MB).
            Get-ChildItem $d -Recurse -Filter *.exe | Where-Object Name -ne 'llama-server.exe' | Remove-Item -Force
          }
          "$tag" | Out-File dist/LLAMA_VERSION.txt

      - name: Stage files
        shell: pwsh
        run: |
          Copy-Item target/release/manga-local.exe dist/
          Copy-Item assets/config.default.toml dist/
          Copy-Item -Recurse assets/glossary dist/glossary
          Copy-Item -Recurse assets/bench dist/bench
          Copy-Item -Recurse assets/fonts dist/fonts
          Copy-Item -Recurse extension dist/extension
          Copy-Item README.md, LICENSE dist/

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/MangaLocal | Out-Null
          Copy-Item dist/* portable/MangaLocal -Recurse -Exclude llama-vulkan,llama-cpu
          Copy-Item -Recurse dist/llama-vulkan portable/MangaLocal/llama
          "portable" | Out-File portable/MangaLocal/portable.txt
          Compress-Archive portable/MangaLocal MangaLocal-portable-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DDist=$PWD\dist" installer\manga-local.iss
          Get-ChildItem installer/Output

      - uses: actions/upload-artifact@v4
        with:
          name: manga-local-windows
          path: |
            installer/Output/*.exe
            MangaLocal-portable-x64.zip

      - name: Keep only the 5 newest builds and runs
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ids = gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100&name=manga-local-windows" --jq '.artifacts | sort_by(.created_at) | reverse | .[5:] | .[].id'
          foreach ($id in $ids) { if ($id) { gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; Write-Host "deleted artifact $id" } }
          # Old runs of every workflow too (with their reports): the 5 newest finished ones stay.
          foreach ($wf in 'release.yml','quality.yml','ocr-models.yml') {
            $runs = gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?status=completed&per_page=100" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[5:] | .[].id'
            foreach ($id in $runs) { if ($id) { gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" | Out-Null; Write-Host "deleted run $id ($wf)" } }
          }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            MangaLocal-portable-x64.zip

  screenshots:
    # Real Windows OCR on tests/screens with the build above (its portable zip).
    runs-on: windows-latest
    needs: windows
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manga-local-windows
          path: build

      - name: Unpack the portable build
        shell: pwsh
        run: Expand-Archive build/MangaLocal-portable-x64.zip -DestinationPath app

      - name: Windows OCR for Korean and Japanese
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 50
        run: |
          # Windows Update on the runner sometimes fails once ("file already exists"); try again.
          foreach ($l in 'ko-KR', 'ja-JP') {
            for ($try = 1; $try -le 3; $try++) {
              $cap = Get-WindowsCapability -Online -Name "Language.OCR*$l*"
              Write-Host "$l try $try : $($cap.Name) $($cap.State)"
              if ($cap.State -eq 'Installed') { break }
              try { $cap | Add-WindowsCapability -Online -ErrorAction Stop | Out-Null }
              catch { Write-Host "  failed: $($_.Exception.Message)"; Start-Sleep -Seconds 15 }
            }
          }

      - name: manga-ocr model (vertical Japanese page)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ja-models | Out-Null
          foreach ($f in 'vocab.txt','decoder_model.onnx','encoder_model.onnx') {
            curl.exe -fsSL -o "ja-models/$f" "https://huggingface.co/mayocream/manga-ocr-onnx/resolve/main/$f"
          }
          Get-ChildItem ja-models | Format-Table Name, Length

      - name: Screenshot tests (real Windows OCR on tests/screens)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $p = Start-Process -FilePath app\MangaLocal\manga-local.exe -ArgumentList '--selftest','tests\screens','--out','selftest-report.md','--ja-models','ja-models' -Wait -PassThru
          Write-Host "exit code $($p.ExitCode)"
          if (Test-Path selftest-report.md) { Get-Content selftest-report.md }
          if ($p.ExitCode -eq 2) { Write-Host "::warning::Windows OCR is not available on the runner - screenshot tests skipped"; exit 0 }
          exit $p.ExitCode

      - name: Hard cases (report only, never fails the build)
        if: always()
        shell: pwsh
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath app\MangaLocal\manga-local.exe -ArgumentList '--selftest','tests\hard','--out','hard-report.md','--ja-models','ja-models' -Wait -PassThru
          Write-Host "exit code $($p.ExitCode)"
          if (Test-Path hard-report.md) { Get-Content hard-report.md }
          exit 0

      - name: Neural OCR models (PaddleOCR via RapidOCR, Apache-2.0)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ocr-models | Out-Null
          $base = 'https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.10.0/onnx'
          foreach ($f in 'PP-OCRv6/det/PP-OCRv6_det_small.onnx','PP-OCRv6/rec/PP-OCRv6_rec_small.onnx',
                         'PP-OCRv5/rec/korean_PP-OCRv5_rec_mobile.onnx','PP-OCRv5/rec/en_PP-OCRv5_rec_mobile.onnx') {
            curl.exe -fsSL --retry 3 -o "ocr-models/$(Split-Path $f -Leaf)" "$base/$f"
          }
          Get-ChildItem ocr-models | Format-Table Name, Length

      - name: Neural OCR on all pages (report only)
        if: always()
        shell: pwsh
        timeout-minutes: 20
        continue-on-error: true
        run: |
          foreach ($d in 'screens','hard') {
            $p = Start-Process -FilePath app\MangaLocal\manga-local.exe -ArgumentList '--selftest',"tests\$d",'--out',"neural-$d-report.md",'--ja-models','ja-models','--neural','ocr-models' -Wait -PassThru
            Write-Host "$d exit code $($p.ExitCode)"
            if (Test-Path "neural-$d-report.md") { Get-Content "neural-$d-report.md" }
          }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report
          path: |
            selftest-report.md
            hard-report.md
            neural-screens-report.md
            neural-hard-report.md
          retention-days: 7
