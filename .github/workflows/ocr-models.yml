# Publishes the neural OCR models (PaddleOCR via RapidOCR, Apache-2.0) as the
# release «ocr-models-v1» of this repository: Manga Local downloads them from
# there (GitHub opens everywhere), ModelScope stays the second address.
name: ocr-models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.10.0/onnx
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          mkdir -p out
          # PP-OCRv6 small (Chinese, English, Japanese) ships inside the RapidOCR wheel.
          pip download --no-deps -d wheel rapidocr==3.10.0
          unzip -q -o wheel/*.whl 'rapidocr/models/*' -d wheel
          cp wheel/rapidocr/models/PP-OCRv6_det_small.onnx wheel/rapidocr/models/PP-OCRv6_rec_small.onnx out/
          for f in PP-OCRv6/det/PP-OCRv6_det_small.onnx PP-OCRv6/rec/PP-OCRv6_rec_small.onnx PP-OCRv5/rec/korean_PP-OCRv5_rec_mobile.onnx PP-OCRv5/rec/en_PP-OCRv5_rec_mobile.onnx \
                   PP-OCRv5/rec/latin_PP-OCRv5_rec_mobile.onnx PP-OCRv6/det/PP-OCRv6_det_tiny.onnx; do
            curl -fL --retry 3 -o "out/$(basename $f)" "$BASE/$f"
          done
          unzip -p wheel/*.whl 'rapidocr-*.dist-info/licenses/MODEL_LICENSES.md' > out/MODEL_LICENSES.md || true
          ls -la out
          pip install -q onnx
          python3 - <<'PY'
          import onnx, glob
          for f in sorted(glob.glob('out/*.onnx')):
              m = onnx.load(f, load_external_data=False)
              meta = {p.key: len(p.value) for p in m.metadata_props}
              print(f, meta)
          PY
          sha256sum out/*.onnx
      - name: Check sizes (the program checks them too)
        run: |
          set -e
          check() { test "$(stat -c %s "out/$1")" = "$2" || { echo "$1: size $(stat -c %s "out/$1"), expected $2"; exit 1; }; }
          check PP-OCRv6_det_small.onnx 9929594
          check PP-OCRv6_rec_small.onnx 21234383
          check korean_PP-OCRv5_rec_mobile.onnx 13488748
          check en_PP-OCRv5_rec_mobile.onnx 7872351
      - name: Publish release ocr-models-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat > notes.md <<'MD'
          Модели распознавания текста для Manga Local (настройка «Распознавание текста → Нейросеть»).
          Программа скачивает их сама, вручную ничего делать не нужно.

          PaddleOCR (© Baidu / PaddlePaddle Authors), ONNX-версии из проекта RapidOCR
          (ModelScope `RapidAI/RapidOCR`, v3.10.0). Лицензия Apache-2.0, файлы не изменены.
          MD
          files="out/PP-OCRv6_det_small.onnx out/PP-OCRv6_rec_small.onnx out/korean_PP-OCRv5_rec_mobile.onnx out/en_PP-OCRv5_rec_mobile.onnx"
          [ -s out/MODEL_LICENSES.md ] && files="$files out/MODEL_LICENSES.md"
          if gh release view ocr-models-v1 >/dev/null 2>&1; then
            gh release upload ocr-models-v1 $files --clobber
          else
            gh release create ocr-models-v1 $files --title "Модели распознавания текста (PaddleOCR)" --notes-file notes.md --latest=false
          fi
