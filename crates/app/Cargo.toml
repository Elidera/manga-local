[package]
name = "manga-local"
description = "Local neural manga / manhwa / manhua translator (Korean, Japanese, Chinese → Russian), Windows overlay"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "manga-local"
path = "src/main.rs"

[dependencies]
manga-core = { path = "../core" }
manga-pages = { path = "../pages" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[features]
# Vertical / handwritten Japanese through manga-ocr (ONNX Runtime, linked
# statically; MSVC build). The release build turns it on.
vertical-ja = ["dep:manga-ocr-rs", "dep:image", "dep:ort", "neural-ocr"]
# Text found and read by PaddleOCR models (ONNX Runtime, linked in).
neural-ocr = ["dep:manga-neural-ocr", "manga-neural-ocr/download", "manga-neural-ocr/gpu"]

[target.'cfg(windows)'.dependencies]
manga-ocr-rs = { version = "1", optional = true }
manga-neural-ocr = { path = "../ocr", optional = true }
# manga-ocr-rs 1.0 is written for this ONNX Runtime binding (later rc changed the API).
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls"], optional = true }
image = { version = "0.25", default-features = false, optional = true }
png = "0.17"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
